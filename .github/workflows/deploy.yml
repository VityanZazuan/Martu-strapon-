name: Deploy Strapi to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy project files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/www-root/data/www/strapi"
          overwrite: true
          rm: true

      - name: SSH into VPS and install deps + build + restart pm2
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/www-root/data/www/strapi
            npm ci --omit=dev
            npm run build
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save
